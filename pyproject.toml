[project]
name = "jeep-obd"
version = "0.1.0"
description = "Read-only DIY diagnostics and dashboard for the Jeep Grand Cherokee (WK2) using a USB OBD-II adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
keywords = ["obd", "obd2", "jeep", "grand-cherokee", "diagnostics", "transmission"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["obd>=0.7.2", "pyserial>=3.5"]

[project.scripts]
jeep-obd = "jeep_obd.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeep_obd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
